const { useState, useEffect, useRef } = React;

const localStore = {
  async get(k) {
    const v = localStorage.getItem(k);
    if (v === null) throw new Error("not found");
    return { key: k, value: v };
  },
  async set(k, v) {
    localStorage.setItem(k, v);
    return { key: k, value: v };
  },
};

const isWorkHours = (s = DEFAULT_SETTINGS, d = new Date()) => {
  const day = d.getDay(); // 0 Sun … 6 Sat
  if (day === 0 || day === 6) return false;
  const parts = (v, fb) => {
    const m = String(v || fb).split(":");
    return (Number(m[0]) || 0) * 60 + (Number(m[1]) || 0);
  };
  const mins = d.getHours() * 60 + d.getMinutes();
  return mins >= parts(s.workStart, "04:30") && mins < parts(s.workEnd, "16:00");
};

const fmtDay = (ts) => {
  const d = new Date(ts);
  const today = new Date();
  if (d.toDateString() === today.toDateString()) return "Today";
  const y = new Date(Date.now() - 864e5);
  if (d.toDateString() === y.toDateString()) return "Yesterday";
  return d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
};

const fmtClock = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

  const d = new Date(ts);

  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
};

const fmtDur = (ms) => {
  const m = Math.round(ms / 60000);
  const h = Math.floor(m / 60);
  const mm = m % 60;
  if (h === 0) return `${mm}m`;
  return mm === 0 ? `${h}h` : `${h}h ${mm}m`;
};

const toRoman = (n) => {
  const map = [
    [50, "l"],
    [40, "xl"],
    [10, "x"],
    [9, "ix"],
    [5, "v"],
    [4, "iv"],
    [1, "i"],
  ];
  let r = "";
  let x = n;
  for (const [v, s] of map) {
    while (x >= v) {
      r += s;
      x -= v;
    }
  }
  return r;
};

const ordinal = (n) => {
  const s = ["th", "st", "nd", "rd"];
  const v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
};

const mondayOf = (d) => {
  const dt = new Date(d);
  const day = (dt.getDay() + 6) % 7;
  dt.setHours(0, 0, 0, 0);
  dt.setDate(dt.getDate() - day);
  return dt;
};

  // tasks

  // entry editing + history + backup

  const [eMin, setEMin] = useState("");

  const [eTs, setETs] = useState("");
  const [logLimit, setLogLimit] = useState(30);
  const [backupText, setBackupText] = useState("");

  // which nope stack is shown/edited; null = follow the clock
  const [stackView, setStackView] = useState(null); // 'work' | 'off' | null
  const [editStack, setEditStack] = useState(isWorkHours() ? "work" : "off");

  // meditation timer
  const [medOpen, setMedOpen] = useState(false);
  const [medOrigin, setMedOrigin] = useState("nope"); // 'nope' | 'fullmind'
  const [medTotal, setMedTotal] = useState(0);

  const store = localStore;

  useEffect(() => {
    (async () => {
      let found = false;
      try {
        if (store) {
          const res = await store.get(KEY);
          if (res && res.value) {
            found = true;
            const parsed = JSON.parse(res.value);
            const merged = { ...DEFAULTS, ...parsed };
            // older OTF entries had no miles — credit the treadmill portion
            merged.workouts = (merged.workouts || []).map((w) =>
              w.kind === "otf" && (w.miles === undefined || w.miles === null)

            );
            if (!parsed.stacks) {
              merged.stacks = {
                work: DEFAULT_WORK_STACK,
                off: DEFAULT_OFF_STACK,

            } else {
              merged.stacks = {
                work: parsed.stacks.work || DEFAULT_WORK_STACK,
                off: parsed.stacks.off || DEFAULT_OFF_STACK,

            // one-time adoption of the handwritten home stack
            if (!parsed.stackRev || parsed.stackRev < 2) {
              merged.stacks.off = DEFAULT_OFF_STACK;
              merged.stackRev = 2;
            }
            merged.tasks =

            merged.settings = { ...DEFAULT_SETTINGS, ...(parsed.settings || {}) };

              parsed.front && typeof parsed.front === "object"
                ? parsed.front
                : { work: null, home: null };
            merged.gaps = Array.isArray(parsed.gaps) ? parsed.gaps : [];

              const up = (arr) =>

                  imp: "important",
                  mind: "fullmind",
                  unsorted: true,
                  ...t,
                }));
              merged.tasks = { work: up(merged.tasks.work), home: up(merged.tasks.home) };
              merged.taskRev = 3;
            }
            delete merged.stack;
            setData(merged);
            try {
              const st = { ...DEFAULT_SETTINGS, ...(merged.settings || {}) };
              const hadQuery = /[?&](view|text|title|url)=/.test(window.location.search || "");

                const cs = (merged.checkins || [])
                  .filter((c) => STATES[c.state])
                  .sort((a, b) => b.ts - a.ts);
                if (cs.length) {
                  const timedOut =
                    Date.now() - cs[0].ts > (Number(st.nopeHours) || 5) * 3600e3;

                  setView({ name: "state", state: timedOut ? "nope" : cs[0].state });
                }
              }
            } catch (e2) {}
          }
        }
      } catch (e) {
        // no saved data yet — start fresh
      }
      if (!found && store) setNeedImport(true);
      setLoaded(true);
      // was the book closed for a while? ask about the gap
      try {
        if (store) {
          const seen = await store.get(KEY + "_seen").catch(() => null);
          const t = seen && seen.value ? Number(seen.value) : 0;
          if (t && Date.now() - t > GAP_MIN_MS) setGap({ start: t, cursor: t, entries: [] });
        }
      } catch (e3) {}
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

      const t = Date.now();

      if (store) store.set(KEY + "_seen", String(t)).catch(() => {});
    };
    const onVis = () => {
      if (document.visibilityState === "hidden") markSeen();
      else if (document.visibilityState === "visible") {
        const t = hiddenAtRef.current;
        if (t && Date.now() - t > GAP_MIN_MS) setGap({ start: t, cursor: t, entries: [] });
      }
    };
    document.addEventListener("visibilitychange", onVis);
    window.addEventListener("pagehide", markSeen);
    return () => {
      document.removeEventListener("visibilitychange", onVis);
      window.removeEventListener("pagehide", markSeen);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // handle Android share-target and icon shortcuts
  useEffect(() => {
    try {
      const q = new URLSearchParams(window.location.search);
      const v = q.get("view");
      if (v === "tasks") setView({ name: "tasks" });
      const shared = [q.get("title"), q.get("text"), q.get("url")]
        .filter(Boolean)
        .join(" ")
        .trim();
      if (shared) setShareIn(shared);
      if (v || shared) window.history.replaceState({}, "", window.location.pathname);
    } catch (e) {}
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // tick the meditation timer — clock-based, so it survives screen sleep
  useEffect(() => {
    if (!medOpen || medDone) return;
    const tick = () =>
      setMedLeft(Math.max(0, Math.ceil((medEndRef.current - Date.now()) / 1000)));
    tick();
    const t = setInterval(tick, 500);
    const onVis = () => {
      if (document.visibilityState === "visible") {
        tick();
        requestWake();
        try {
          if (audioRef.current && audioRef.current.resume) audioRef.current.resume();
        } catch (e) {}
      }
    };
    document.addEventListener("visibilitychange", onVis);
    return () => {
      clearInterval(t);
      document.removeEventListener("visibilitychange", onVis);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [medOpen, medDone]);

  // finish the meditation timer
  useEffect(() => {
    if (medOpen && !medDone && medTotal > 0 && medLeft === 0) {
      setMedDone(true);
      chime();
      releaseWake();
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [medLeft, medOpen, medDone, medTotal]);

  const chime = () => {
    try {
      if (navigator.vibrate)
        navigator.vibrate(data.medSilent ? [400, 150, 400, 150, 700] : [200, 120, 200, 120, 500]);
    } catch (e) {}
    if (data.medSilent) return;
    try {
      const ctx = audioRef.current;
      if (!ctx) return;
      if (ctx.state === "suspended" && ctx.resume) ctx.resume();
      const play = (freq, t0) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = "sine";
        o.frequency.value = freq;
        o.connect(g);
        g.connect(ctx.destination);
        g.gain.setValueAtTime(0.0001, ctx.currentTime + t0);
        g.gain.exponentialRampToValueAtTime(0.32, ctx.currentTime + t0 + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t0 + 1.8);
        o.start(ctx.currentTime + t0);
        o.stop(ctx.currentTime + t0 + 2);
      };
      play(523.25, 0);
      play(659.25, 0.22);
      play(783.99, 0.44);
      play(523.25, 1.6);
      play(659.25, 1.82);
      play(783.99, 2.04);
    } catch (e) {
      // silence is also fine
    }
  };

  const requestWake = async () => {
    try {
      if (navigator.wakeLock && navigator.wakeLock.request) {
        wakeLockRef.current = await navigator.wakeLock.request("screen");
        setWakeOk(true);
        if (wakeLockRef.current.addEventListener) {
          wakeLockRef.current.addEventListener("release", () => setWakeOk(false));
        }
      } else {
        setWakeOk(false);
      }
    } catch (e) {
      setWakeOk(false);
    }
  };

  const releaseWake = () => {
    try {
      if (wakeLockRef.current && wakeLockRef.current.release) wakeLockRef.current.release();
    } catch (e) {}
    wakeLockRef.current = null;
    setWakeOk(false);
  };

  const commit = (next) => {
    setData(next);
    if (store) {
      store
        .set(KEY, JSON.stringify(next))
        .then(() => {
          setLastSaved(Date.now());
          setSaveErr(false);
        })
        .catch((e) => {
          console.error("save failed", e);
          setSaveErr(true);
          ping("Save failed");
        });
    }
  };

  const ping = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 1600);
  };

  // ————— actions —————
  const checkIn = (stateKey) => {
    const c = { id: uid(), state: stateKey, ts: Date.now(), tried: [] };
    if (stateKey === "nope") {
      const front = workTask(deckKey, mindNow);
      if (front && !front.virtual) c.avoiding = front.text;
    }
    commit({ ...data, checkins: [c, ...data.checkins] });
    setActiveCheckin(c.id);
    setStackView(null); // follow the clock again on a fresh check-in
    setView({ name: "state", state: stateKey });
  };

  // ————— the gap interview —————
  const stateAt = (ts) => {
    const before = data.checkins.filter((c) => STATES[c.state] && c.ts <= ts).sort((a, b) => b.ts - a.ts)[0];
    if (!before) return null;
    return ts - before.ts > NOPE_MS ? "nope" : before.state;
  };
  const gapAdd = (minutes) => {
    if (!gap) return;
    const act = gapAct === "Other" ? gapOther.trim() || "Other" : gapAct;
    if (!act) return;
    const to = minutes == null ? Date.now() : Math.min(Date.now(), gap.cursor + minutes * 60e3);
    const entries = [...gap.entries, { activity: act, from: gap.cursor, to }];
    setGap({ ...gap, cursor: to, entries });
    setGapAct(null);
    setGapOther("");
    if (to >= Date.now() - 60e3) gapFinish(entries);
  };
  const gapUndo = () => {
    if (!gap || !gap.entries.length) return;
    const entries = gap.entries.slice(0, -1);
    setGap({ ...gap, cursor: entries.length ? entries[entries.length - 1].to : gap.start, entries });
  };
  const gapFinish = (entriesArg) => {
    const entries = entriesArg || (gap ? gap.entries : []);
    if (entries.length) {
      const rows = entries.map((e) => ({
        id: uid(),
        activity: e.activity,
        ts: e.from,
        to: e.to,
        state: stateAt(e.from),
      }));
      commit({ ...data, gaps: [...rows, ...(data.gaps || [])] });
      ping(rows.length + " logged");
    }
    setGap(null);
    setGapAct(null);
    setGapOther("");
  };

  const markTried = (item) => {
    const target = activeCheckin || (data.checkins[0] && data.checkins[0].id);
    if (!target) return;
    commit({
      ...data,
      checkins: data.checkins.map((c) =>
        c.id === target && !c.tried.includes(item)
          ? { ...c, tried: [...c.tried, item] }
          : c
      ),
    });
  };

  const startMeditation = (seconds, item) => {
    markTried(item);
    setMedOrigin(view.state === "fullmind" ? "fullmind" : "nope");
    try {
      // create the audio context on the tap so the end-chime is allowed
      if (!audioRef.current) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioRef.current = new AC();
      }
      if (audioRef.current && audioRef.current.state === "suspended") {
        audioRef.current.resume();
      }
    } catch (e) {}
    setMedTotal(seconds);
    medEndRef.current = Date.now() + seconds * 1000;
    setMedLeft(seconds);
    setMedDone(false);
    setMedOpen(true);
    requestWake();
  };

  const closeMeditation = () => {
    releaseWake();
    setMedOpen(false);
    setMedTotal(0);
    setMedLeft(0);
    setMedDone(false);
  };

  const releaseDump = () => {
    const text = dumpText.trim();
    if (!text) return;
    commit({ ...data, dumps: [{ id: uid(), text, ts: Date.now() }, ...data.dumps] });
    setDumpText("");
    ping("Set down");
  };

  const saveWorkout = () => {
    const when = logWhen ? new Date(logWhen).getTime() : NaN;
    const ts = !isNaN(when) ? when : Date.now();
    if (logKind === "otf") {
      const m = parseInt(otfMin, 10);
      const mi = parseFloat(otfMiles);
      if (!m || m <= 0) return;
      commit({
        ...data,
        workouts: [
          {
            id: uid(),
            kind: "otf",
            minutes: m,
            miles: mi > 0 ? mi : 0,
            muscles: logMuscles,
            ts,
          },
          ...data.workouts,
        ],
      });
    } else {
      const mi = parseFloat(runMiles);
      if (!mi || mi <= 0) return;
      const m = parseInt(runMin, 10);
      commit({
        ...data,
        workouts: [
          { id: uid(), kind: "trail", miles: mi, minutes: m > 0 ? m : null, ts },
          ...data.workouts,
        ],
      });
    }
    setLogKind(null);
    setLogMuscles([]);
    setRunMiles("");
    setRunMin("");
    setOtfMin("60");
    setOtfMiles(String(S.otfMiles));
    setLogWhen("");
    ping("Inscribed");
  };

  const removeEntry = (type, id) => {
    if (type === "checkin")
      commit({ ...data, checkins: data.checkins.filter((c) => c.id !== id) });
    if (type === "workout")
      commit({ ...data, workouts: data.workouts.filter((w) => w.id !== id) });
    if (type === "dump") commit({ ...data, dumps: data.dumps.filter((d) => d.id !== id) });
    if (type === "task")
      commit({ ...data, taskLog: (data.taskLog || []).filter((x) => x.id !== id) });
    if (type === "gap") commit({ ...data, gaps: (data.gaps || []).filter((x) => x.id !== id) });
  };

  const stackMove = (key, i, dir) => {
    const s = [...data.stacks[key]];
    const j = i + dir;
    if (j < 0 || j >= s.length) return;
    [s[i], s[j]] = [s[j], s[i]];
    commit({ ...data, stacks: { ...data.stacks, [key]: s } });
  };

  const stackRemove = (key, i) => {
    commit({
      ...data,
      stacks: { ...data.stacks, [key]: data.stacks[key].filter((_, k) => k !== i) },
    });
  };

  const stackAdd = (key) => {
    const v = newItem.trim();
    if (!v) return;
    commit({ ...data, stacks: { ...data.stacks, [key]: [...data.stacks[key], v] } });
    setNewItem("");
  };

  const openEdit = (e) => {
    setEditEntry({ type: e.type, id: e.id });
    setETs(toLocalInput(e.ts));
    if (e.type === "workout") {
      setEMiles(e.miles != null ? String(e.miles) : "");
      setEMin(e.minutes != null ? String(e.minutes) : "");
      setEMuscles(e.muscles || []);
    }
    if (e.type === "dump" || e.type === "task") setEText(e.text || "");
    if (e.type === "checkin") setEState(e.state);
  };

  const saveEdit = () => {
    if (!editEntry) return;
    const patch = {};
    const ts = eTs ? new Date(eTs).getTime() : NaN;
    if (!isNaN(ts)) patch.ts = ts;
    if (editEntry.type === "workout") {
      const mi = parseFloat(eMiles);
      const mn = parseInt(eMin, 10);
      if (!isNaN(mi) && mi >= 0) patch.miles = mi;
      if (mn > 0) patch.minutes = mn;
      patch.muscles = eMuscles;
    }
    if (editEntry.type === "dump" || editEntry.type === "task") {
      const t = eText.trim();
      if (t) patch.text = t;
    }
    if (editEntry.type === "checkin") patch.state = eState;
    const map = (arr) => arr.map((x) => (x.id === editEntry.id ? { ...x, ...patch } : x));
    if (editEntry.type === "checkin") commit({ ...data, checkins: map(data.checkins) });
    if (editEntry.type === "workout") commit({ ...data, workouts: map(data.workouts) });
    if (editEntry.type === "dump") commit({ ...data, dumps: map(data.dumps) });
    if (editEntry.type === "task") commit({ ...data, taskLog: map(data.taskLog || []) });
    setEditEntry(null);
    ping("Amended");
  };

  const exportBackup = () => {
    const json = JSON.stringify(data);
    setBackupText(json);
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard
          .writeText(json)
          .then(() => ping("Copied"))
          .catch(() => ping("Backup ready below"));
      } else {
        ping("Backup ready below");
      }
    } catch (e) {
      ping("Backup ready below");
    }
  };

  const restoreBackup = () => {
    try {
      const p = JSON.parse(backupText);
      // snapshot the current state first, so a bad restore can be undone
      if (store) {
        store.set(KEY + "_undo", JSON.stringify(data)).catch(() => {});
      }
      const byId = (imported = [], local = []) => {
        const m = new Map();
        [...local, ...imported].forEach((x) => x && x.id && m.set(x.id, x));
        return [...m.values()].sort((a, b) => b.ts - a.ts);
      };
      const mergeTasks = (imported, local) => {
        const imp = Array.isArray(imported) ? imported : [];
        const loc = Array.isArray(local) ? local : [];
        const seen = new Set(imp.map((t) => t.id));
        return [...imp, ...loc.filter((t) => !seen.has(t.id))];
      };
      const next = {
        ...data,
        checkins: byId(p.checkins, data.checkins),
        workouts: byId(p.workouts, data.workouts),
        dumps: byId(p.dumps, data.dumps),
        taskLog: byId(p.taskLog, data.taskLog),
        gaps: byId(p.gaps, data.gaps),
        stacks: p.stacks && p.stacks.work && p.stacks.off ? p.stacks : data.stacks,
        tasks: {
          work: mergeTasks(p.tasks && p.tasks.work, data.tasks.work),
          home: mergeTasks(p.tasks && p.tasks.home, data.tasks.home),
        },
        stackRev: Math.max(data.stackRev || 2, p.stackRev || 2),
        taskRev: Math.max(data.taskRev || 3, p.taskRev || 3),
        settings: { ...DEFAULT_SETTINGS, ...(data.settings || {}), ...(p.settings || {}) },
        top3: p.top3 && p.top3.work && p.top3.home ? p.top3 : data.top3,
        meetings: mergeTasks(p.meetings, data.meetings),
      };
      commit(next);
      ping("Restored");
      setNeedImport(false);
      setBackupText("");
      return true;
    } catch (e) {
      ping("Bad backup");
      return false;
    }
  };

  const undoRestore = async () => {
    try {
      if (!store) return;
      const res = await store.get(KEY + "_undo");
      if (res && res.value) {
        const prev = JSON.parse(res.value);
        commit({ ...DEFAULTS, ...prev });
        ping("Recovered");
      } else {
        ping("No snapshot");
      }
    } catch (e) {
      ping("No snapshot");
    }
  };

  // ————— tasks: the deck (work / home) —————
  const taskKeyNow = isWorkHours(S) ? "work" : "home";
  const taskOpen = (key) => (data.tasks[key] || []).filter((t) => t.state === "open");
  const setTasks = (key, list) => commit({ ...data, tasks: { ...data.tasks, [key]: list } });

  // ——— the algorithm, in plain words ———
  // Up to three tasks wait ON DECK. You always work the FRONT one.
  // Empty deck slots refill themselves, oldest first, from:
  //   1. urgent tasks (shown in any mental state; importants past their date count as urgent)
  //   2. important tasks tagged with the current mental state
  //   3. normal tasks tagged with the current mental state
  // Resolve the front task (done / later / keep on deck) and the next one steps up.
  const effImp = (t) =>
    t.imp === "urgent" || (t.imp === "important" && t.urgentAt && t.urgentAt <= now)
      ? "urgent"
      : t.imp === "important"
      ? "important"
      : "normal";
  const importantCount = (key) => taskOpen(key).filter((t) => effImp(t) === "important").length;
  const unsortedCount = (key) => taskOpen(key).filter((t) => t.unsorted).length;
  const deckFor = (key, mind) => {
    const open = taskOpen(key);
    const pinnedIds = (data.top3 && data.top3[key]) || [];
    const pinned = pinnedIds.map((id) => open.find((t) => t.id === id)).filter(Boolean);
    const virtuals = [];
    if (importantCount(key) > (Number(S.impCap) || 30))
      virtuals.push({
        id: "cull:" + key,
        virtual: "cull",
        text: "Cull the herd — " + importantCount(key) + " important tasks, cap is " + S.impCap,
        imp: "important",
        mind: "fullmind",
      });
    if (unsortedCount(key) >= 5)
      virtuals.push({
        id: "sort:" + key,
        virtual: "sort",
        text: "Sort the tasks — " + unsortedCount(key) + " unsorted",
        imp: "important",
        mind: "wuwei",
      });
    const meetVirtuals = [];
    if (key === "work")
      meetingsDue()
        .slice(0, 2)
        .forEach((m) => {
          const n = (m.agenda || []).length;
          meetVirtuals.push({
            id: "meet:" + m.id,
            virtual: "meet",
            text:
              "Set up meeting w/ " +
              m.name +
              (n ? " · " + n + " agenda item" + (n === 1 ? "" : "s") : ""),
            imp: "urgent",
            mind: "fullmind",
          });
        });
    const urgents = [...open.filter((t) => effImp(t) === "urgent"), ...meetVirtuals];
    const metaTasks = virtuals.filter((v) => v.mind === mind);
    const candidates = [
      ...open.filter((t) => effImp(t) === "important" && t.mind === mind),
      ...open.filter((t) => effImp(t) === "normal" && t.mind === mind),
    ];
    // urgents take the front, then the book's own meta-tasks, then your pins
    const deck = [...urgents.slice(0, 2), ...metaTasks.slice(0, 1)];
    for (const p of pinned) {
      if (deck.length >= 3) break;
      if (!deck.some((d) => d.id === p.id)) deck.push(p);
    }
    for (const c of [...urgents.slice(2), ...metaTasks.slice(1), ...candidates]) {
      if (deck.length >= 3) break;
      if (!deck.some((d) => d.id === c.id)) deck.push(c);
    }
    // anything you set down with "keep on deck" sinks to the bottom
    const heldMap = (data.held && data.held[key]) || {};
    const ordered = deck
      .map((t, i) => ({ t, i, h: heldMap[t.id] || 0 }))
      .sort((a, b) => (a.h ? 1 : 0) - (b.h ? 1 : 0) || a.h - b.h || a.i - b.i)
      .map((x) => x.t);
    // a task you chose to work leads, whatever its tier
    const fid = data.front && data.front[key];
    const chosen = fid ? ordered.find((t) => t.id === fid) : null;
    return chosen ? [chosen, ...ordered.filter((t) => t.id !== fid)] : ordered;
  };
  const workTask = (key, mind) => deckFor(key, mind)[0] || null;
  // every screen reads the same deck: the list you're viewing, else the clock's list
  const deckKey = taskView || taskKeyNow;
  const openVirtual = (v) => {
    setTaskView(deckKey);
    setView({ name: "tasks" });
    if (v.virtual === "cull") setCullOpen(true);
    else if (v.virtual === "meet") setMeetView(true);
    else if (v.virtual === "sort") {
      setQaImp("important");
      setQaMind("fullmind");
      setSortOpen(true);
    }
  };
  const openTaskCard = (t) => {
    if (t && t.virtual) openVirtual(t);
    else {
      setTaskView(deckKey);
      setView({ name: "tasks" });
    }
  };
  const pinToggle = (key, id) => {
    const cur = (data.top3 && data.top3[key]) || [];
    const on = cur.includes(id);
    const next = on ? cur.filter((x) => x !== id) : [...cur, id].slice(-3);
    commit({ ...data, top3: { ...data.top3, [key]: next } });
    ping(on ? "Off the deck" : "On the deck");
  };
  const frontTask = (key, id, mind) => {
    const rest = deckFor(key, mind)
      .filter((t) => !t.virtual && t.id !== id)
      .map((t) => t.id);
    commit({
      ...data,
      top3: { ...data.top3, [key]: [id, ...rest].slice(0, 3) },
      held: clearHeld(key, id),
      front: { ...data.front, [key]: id },
    });
    ping("Now the front");
  };
  const keepOnDeck = (key, id, mind) => {
    const t = (data.tasks[key] || []).find((x) => x.id === id);
    const others = deckFor(key, mind)
      .filter((x) => !x.virtual && x.id !== id)
      .map((x) => x.id);
    const entry = t ? { id: uid(), text: t.text, how: "keep", list: key, ts: Date.now() } : null;
    commit({
      ...data,
      top3: { ...data.top3, [key]: [...others, id].slice(-3) },
      held: { ...data.held, [key]: { ...((data.held && data.held[key]) || {}), [id]: Date.now() } },
      front: { ...data.front, [key]: (data.front && data.front[key]) === id ? null : (data.front || {})[key] },
      taskLog: entry ? [entry, ...(data.taskLog || [])] : data.taskLog,
    });
    ping("Set down — back of the deck");
  };
  const clearHeld = (key, id) => {
    const cur = { ...((data.held && data.held[key]) || {}) };
    delete cur[id];
    return { ...data.held, [key]: cur };
  };
  const newTaskObj = (text, imp, mind, urgentAt, unsorted) => ({
    id: uid(),
    text,
    state: "open",
    imp: imp || "normal",
    mind: mind || "fullmind",
    urgentAt: urgentAt || null,
    unsorted: !!unsorted,
    created: Date.now(),
  });
  const addBulk = (key) => {
    const lines = bulkText
      .split(/\n|;/)
      .map((s) => s.trim())
      .filter(Boolean);
    if (!lines.length) return;
    setTasks(key, [
      ...(data.tasks[key] || []),
      ...lines.map((text, i) => ({
        ...newTaskObj(text, "normal", mindNow, null, true),
        id: uid() + i.toString(36),
      })),
    ]);
    setBulkText("");
    setBulkOpen(false);
    ping(lines.length + " added");
  };
  const addSharedTask = (key) => {
    if (!shareIn) return;
    setTasks(key, [...(data.tasks[key] || []), newTaskObj(shareIn, "normal", mindNow, null, true)]);
    setShareIn(null);
    ping(key === "work" ? "Added to work" : "Added to home");
  };
  const addQuick = () => {
    const v = qaText.trim();
    if (!v) return;
    const when = qaImp === "important" && qaDate ? new Date(qaDate + "T09:00").getTime() : null;
    setTasks(qaList, [...(data.tasks[qaList] || []), newTaskObj(v, qaImp, qaMind, when, false)]);
    setQaText("");
    setQaDate("");
    setQaOpen(false);
    ping("Added");
  };
  const reopenTask = (key, id) => {
    setTasks(
      key,
      (data.tasks[key] || []).map((t) => (t.id === id ? { ...t, state: "open" } : t))
    );
    ping("Reopened");
  };
  const saveTaskEdit = (key) => {
    const v = editTaskText.trim();
    if (!v || !editTaskId) return;
    const when =
      editTaskImp === "important" && editTaskDate
        ? new Date(editTaskDate + "T09:00").getTime()
        : null;
    setTasks(
      key,
      (data.tasks[key] || []).map((t) =>
        t.id === editTaskId
          ? { ...t, text: v, imp: editTaskImp, mind: editTaskMind, urgentAt: when, unsorted: false }
          : t
      )
    );
    setEditTaskId(null);
    ping("Amended");
  };
  const resolveTask = (key, id, how) => {
    // how: 'done' | 'later'
    const list = data.tasks[key] || [];
    const t = list.find((x) => x.id === id);
    if (!t) return;
    let next = list.map((x) =>
      x.id === id ? { ...x, state: how === "done" ? "done" : "reentered", resolved: Date.now() } : x
    );
    if (how === "later")
      next = [...next, { ...t, id: uid(), state: "open", resolved: undefined, created: Date.now() }];
    const entry = {
      id: uid(),
      text: t.text,
      how: how === "done" ? "done" : "reenter",
      list: key,
      ts: Date.now(),
    };
    commit({
      ...data,
      tasks: { ...data.tasks, [key]: next },
      taskLog: [entry, ...(data.taskLog || [])],
      top3: { ...data.top3, [key]: ((data.top3 && data.top3[key]) || []).filter((x) => x !== id) },
      held: clearHeld(key, id),
      front: { ...data.front, [key]: (data.front && data.front[key]) === id ? null : (data.front || {})[key] },
    });
    ping(how === "done" ? "Done" : "Re-entered");
  };
  const deleteTask = (key, id) => setTasks(key, (data.tasks[key] || []).filter((t) => t.id !== id));
  const demoteTask = (key, id) =>
    setTasks(key, (data.tasks[key] || []).map((t) => (t.id === id ? { ...t, imp: "normal" } : t)));
  const sortApply = (key, id, imp, mind) =>
    setTasks(
      key,
      (data.tasks[key] || []).map((t) => (t.id === id ? { ...t, imp, mind, unsorted: false } : t))
    );
  const sweepFinished = (key) =>
    setTasks(key, (data.tasks[key] || []).filter((t) => t.state === "open"));

  // ————— meetings: the roster —————
  const startOfDay = (ts) => {
    const d = new Date(ts);
    d.setHours(0, 0, 0, 0);
    return d.getTime();
  };
  const meetingsDue = () => {
    const day = 86400e3;
    const today = startOfDay(now);
    return (data.meetings || []).filter((m) => {
      if (m.snoozeUntil && m.snoozeUntil > now) return false;
      // anything on the books for today or later is handled
      if (m.scheduledFor && startOfDay(m.scheduledFor) >= today) return false;
      if (!m.lastMet) return true;
      return now - m.lastMet >= (Number(m.cadenceDays) || 14) * day;
    });
  };
  const snoozeMeeting = (id) => {
    const tomorrow = startOfDay(now) + 86400e3;
    setMeetings(
      (data.meetings || []).map((x) => (x.id === id ? { ...x, snoozeUntil: tomorrow } : x))
    );
    ping("In progress — back tomorrow");
  };
  const overdueDays = (m) =>
    m.lastMet ? Math.floor((now - m.lastMet) / 86400e3) - (Number(m.cadenceDays) || 14) : null;
  const setMeetings = (list) => commit({ ...data, meetings: list });
  const addMeeting = () => {
    const nm = mtName.trim();
    if (!nm) return;
    setMeetings([
      ...(data.meetings || []),
      {
        id: uid(),
        name: nm,
        cadenceDays: Number(mtCadence) || 14,
        lastMet: null,
        scheduledFor: null,
        agenda: [],
        created: Date.now(),
      },
    ]);
    setMtName("");
    setMtCadence("");
    ping("On the roster");
  };
  const deleteMeeting = (id) => setMeetings((data.meetings || []).filter((m) => m.id !== id));
  const metToday = (id) => {
    const m = (data.meetings || []).find((x) => x.id === id);
    const entry = m
      ? { id: uid(), text: "Met w/ " + m.name, how: "done", list: "work", ts: Date.now() }
      : null;
    commit({
      ...data,
      meetings: (data.meetings || []).map((x) =>
        x.id === id ? { ...x, lastMet: Date.now(), scheduledFor: null } : x
      ),
      taskLog: entry ? [entry, ...(data.taskLog || [])] : data.taskLog,
    });
    ping("Met — clock reset");
  };
  const scheduleMeeting = (id) => {
    if (!schedDate) return;
    const ts = new Date(schedDate + "T09:00").getTime();
    setMeetings(
      (data.meetings || []).map((x) => (x.id === id ? { ...x, scheduledFor: ts } : x))
    );
    setSchedFor(null);
    ping("On the books");
  };
  const addAgenda = (id) => {
    const v = (agInputs[id] || "").trim();
    if (!v) return;
    setMeetings(
      (data.meetings || []).map((x) =>
        x.id === id ? { ...x, agenda: [...(x.agenda || []), { id: uid(), text: v }] } : x
      )
    );
    setAgInputs({ ...agInputs, [id]: "" });
  };
  const delAgenda = (id, aid) =>
    setMeetings(
      (data.meetings || []).map((x) =>
        x.id === id ? { ...x, agenda: (x.agenda || []).filter((a) => a.id !== aid) } : x
      )
    );
  const setLastMet = (id) => {
    if (!lastMetDate) return;
    const ts = new Date(lastMetDate + "T09:00").getTime();
    if (isNaN(ts)) return;
    setMeetings(
      (data.meetings || []).map((x) => (x.id === id ? { ...x, lastMet: ts } : x))
    );
    setLastMetFor(null);
    ping("Amended");
  };
  const saveMeetingEdit = (id) => {
    const nm = editMeetName.trim();
    if (!nm) return;
    setMeetings(
      (data.meetings || []).map((x) =>
        x.id === id
          ? { ...x, name: nm, cadenceDays: Number(editMeetCadence) || x.cadenceDays }
          : x
      )
    );
    setEditMeetId(null);
    ping("Amended");
  };

  // ————— derived —————
  const now = Date.now();
  const todayCheckins = data.checkins.filter((c) => fmtDay(c.ts) === "Today");
  const todayWorkouts = data.workouts.filter((w) => fmtDay(w.ts) === "Today");
  const todayMiles = todayWorkouts.reduce((a, w) => a + (w.miles || 0), 0);

  const weekStart = mondayOf(new Date()).getTime();
  const thisWeek = data.workouts.filter((w) => w.ts >= weekStart);
  const weekMiles = thisWeek.reduce((a, w) => a + (w.miles || 0), 0);
  const weekRuns = thisWeek.filter((w) => w.kind === "trail").length;
  const weekOtf = thisWeek.filter((w) => w.kind === "otf").length;

  const lastOtf = data.workouts
    .filter((w) => w.kind === "otf")
    .sort((a, b) => b.ts - a.ts)[0];
  const daysSinceOtf = lastOtf ? Math.floor((now - lastOtf.ts) / 864e5) : null;

  const longest = data.workouts
    .filter((w) => w.kind === "trail")
    .reduce((a, w) => Math.max(a, w.miles || 0), 0);

  const weeks = [];
  const mon = mondayOf(new Date());
  for (let k = 3; k >= 0; k--) {
    const s = new Date(mon);
    s.setDate(s.getDate() - 7 * k);
    const e = new Date(s);
    e.setDate(e.getDate() + 7);
    const mi = data.workouts
      .filter((w) => w.ts >= s.getTime() && w.ts < e.getTime())
      .reduce((a, w) => a + (w.miles || 0), 0);
    weeks.push({ label: `${s.getMonth() + 1}/${s.getDate()}`, mi });
  }
  const maxWeek = Math.max(...weeks.map((w) => w.mi), 1);

  // what state does the book believe you're in right now?
  const currentState = (() => {
    const cs = [...data.checkins].filter((c) => STATES[c.state]).sort((a, b) => b.ts - a.ts);
    if (!cs.length) return null;
    const lastC = cs[0];
    const elapsed = now - lastC.ts;
    if (elapsed > NOPE_MS) {
      return { key: "nope", since: lastC.ts + NOPE_MS, timedOut: true };
    }
    return { key: lastC.state, since: lastC.ts, timedOut: false };
  })();
  const mindNow = currentState ? currentState.key : "fullmind";

  // muscle ledger: last blast per group, from tagged workouts
  const lastBlast = {};
  data.workouts.forEach((w) =>
    (w.muscles || []).forEach((k) => {
      if (!lastBlast[k] || w.ts > lastBlast[k]) lastBlast[k] = w.ts;
    })
  );
  const freshMuscles = MUSCLES.filter(
    (m) => lastBlast[m.key] && now - lastBlast[m.key] <= 7 * 86400e3
  ).length;

  // rolling 14-day mileage ceiling, ramped off the previous fortnight
  const milesBetween = (fromAgo, toAgo) =>
    data.workouts
      .filter((w) => w.ts <= now - toAgo * 86400e3 && w.ts > now - fromAgo * 86400e3)
      .reduce((s, w) => s + (w.miles || 0), 0);
  const last14 = milesBetween(14, 0);
  const prior14 = milesBetween(28, 14);
  const RAMP = 1.3; // aggressive: roughly +15% a week, compounded across the fortnight
  const mileTarget = Math.max(prior14 > 0 ? prior14 * RAMP : 6, 6);
  const mileLeft = Math.max(0, mileTarget - last14);
  const overCeiling = last14 > mileTarget;
  const muscleZone = (k) => {
    const ts = lastBlast[k];
    const d = ts ? Math.floor((now - ts) / 86400e3) : null;
    if (k === "abs") return d !== null && d <= 7 ? "go" : "fallow";
    if (d === null || d > 7) return "fallow";
    if (d <= 1) return "rest";
    if (d <= 3) return "soon";
    return "go";
  };
  const ZONES = {
    rest: { bg: T.paper, border: T.lineSoft, color: T.sub, word: "REST", dim: 0.55, bw: 1 },
    soon: { bg: T.paper, border: T.fm, color: T.fm, word: "SOON", dim: 1, bw: 1 },
    go: { bg: "rgba(47,93,63,0.12)", border: T.ww, color: T.ww, word: "GO", dim: 1, bw: 2 },
    fallow: { bg: "rgba(124,32,24,0.10)", border: T.np, color: T.np, word: "FALLOW", dim: 1, bw: 2 },
  };

  // time-in-state: each check-in's state runs until the next check-in,
  // but after 5 unlogged hours the remainder counts as Nope
  const stateIntervals = (() => {
    const cs = [...data.checkins]
      .filter((c) => STATES[c.state])
      .sort((a, b) => a.ts - b.ts);
    const iv = [];
    for (let i = 0; i < cs.length; i++) {
      const start = cs[i].ts;
      const end = i + 1 < cs.length ? cs[i + 1].ts : now;
      if (end <= start) continue;
      const capped = Math.min(end, start + NOPE_MS);
      iv.push({ start, end: capped, state: cs[i].state });
      if (end > capped) iv.push({ start: capped, end, state: "nope" });
    }
    return iv;
  })();

  const dayTallies = (() => {
    const days = [];
    for (let k = 0; k < 7; k++) {
      const d0 = new Date();
      d0.setHours(0, 0, 0, 0);
      d0.setDate(d0.getDate() - k);
      const dayStart = d0.getTime();
      const dayEnd = dayStart + 864e5;
      const totals = { wuwei: 0, fullmind: 0, nope: 0 };
      const segs = [];
      let cursor = dayStart;
      stateIntervals
        .filter((v) => v.end > dayStart && v.start < dayEnd)
        .forEach((v) => {
          const s = Math.max(v.start, dayStart);
          const e = Math.min(v.end, dayEnd);
          if (e <= s) return;
          if (s > cursor) segs.push({ len: s - cursor, state: null });
          segs.push({ len: e - s, state: v.state });
          totals[v.state] += e - s;
          cursor = e;
        });
      if (cursor < dayEnd) segs.push({ len: dayEnd - cursor, state: null });
      const label =
        k === 0
          ? "Today"
          : k === 1
          ? "Yest."
          : `${d0.toLocaleDateString([], { weekday: "short" })} ${d0.getDate()}`;
      days.push({ dayStart, label, totals, segs });
    }
    return days;
  })();

  const weekStateTotals = dayTallies.reduce(
    (a, d) => ({
      wuwei: a.wuwei + d.totals.wuwei,
      fullmind: a.fullmind + d.totals.fullmind,
      nope: a.nope + d.totals.nope,
    }),
    { wuwei: 0, fullmind: 0, nope: 0 }
  );

  const toolTally = {};
  data.checkins
    .filter((c) => c.state === "nope")
    .forEach((c) => (c.tried || []).forEach((t) => (toolTally[t] = (toolTally[t] || 0) + 1)));
  const topTools = Object.entries(toolTally)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 4);

  const timeline = [
    ...data.checkins.map((c) => ({ ...c, type: "checkin" })),
    ...data.workouts.map((w) => ({ ...w, type: "workout" })),
    ...data.dumps.map((d) => ({ ...d, type: "dump" })),
    ...(data.taskLog || []).map((x) => ({ ...x, type: "task" })),
    ...(data.gaps || []).map((x) => ({ ...x, type: "gap" })),
  ]
    .sort((a, b) => b.ts - a.ts);

  // full chronicle as a readable markdown journal
  const buildMarkdown = () => {
    const lines = [];
    lines.push("# Mind & Miles — Chronicle");
    lines.push("");
    lines.push(`_Exported ${new Date().toLocaleString()}_`);
    lines.push("");
    lines.push(
      `**The quest:** 100 miles in 24 hours · longest run so far: ${longest.toFixed(1)} mi`
    );
    lines.push(
      `**On record:** ${data.checkins.length} check-ins · ${data.workouts.length} sessions · ${data.dumps.length} notes`
    );
    lines.push("");
    const openW = (data.tasks.work || []).filter((t) => t.state === "open");
    const openH = (data.tasks.home || []).filter((t) => t.state === "open");
    if (openW.length || openH.length) {
      lines.push("## Task lists");
      const dump = (title, arr) => {
        if (!arr.length) return;
        lines.push(`### ${title}`);
        arr.forEach((t) =>
          lines.push(
            `- ${effImp(t) === "urgent" ? "⚑ " : effImp(t) === "important" ? "◆ " : ""}${t.text}`
          )
        );
        lines.push("");
      };
      dump("At work", openW);
      dump("At home", openH);
    }
    const byDay = new Map();
    timeline.forEach((e) => {
      const k = new Date(e.ts).toDateString();
      if (!byDay.has(k)) byDay.set(k, []);
      byDay.get(k).push(e);
    });
    [...byDay.entries()].forEach(([day, entries]) => {
      const d0 = new Date(day);
      lines.push(
        `## ${d0.toLocaleDateString([], { weekday: "long", year: "numeric", month: "long", day: "numeric" })}`
      );
      entries
        .sort((a, b) => a.ts - b.ts)
        .forEach((e) => {
          const t = fmtTime(e.ts);
          if (e.type === "checkin") {
            const tried = e.tried && e.tried.length ? ` — tried: ${e.tried.join(", ")}` : "";
            lines.push(`- ${t} · **${STATES[e.state].name}**${tried}`);
          } else if (e.type === "workout") {
            lines.push(
              e.kind === "otf"
                ? `- ${t} · Orange Theory — ${e.minutes} min, ${(e.miles || 0).toFixed(1)} mi tread${(e.muscles || []).length ? `, blasted: ${e.muscles.map((k) => (MUSCLES.find((mm) => mm.key === k) || { label: k }).label.toLowerCase()).join(", ")}` : ""}`
                : `- ${t} · Trail run — ${e.miles.toFixed(1)} mi${e.minutes ? `, ${e.minutes} min` : ""}`
            );
          } else if (e.type === "task") {
            lines.push(`- ${t} · ${e.how === "done" ? "✓ Done" : "↻ Progressed"}: ${e.text}`);
          } else if (e.type === "gap") {
            lines.push(`- ${t} · ⌛ ${e.activity} — ${fmtDur(e.to - e.ts)}${e.state ? ` (in ${STATES[e.state] ? STATES[e.state].name : e.state})` : ""}`);
          } else {
            lines.push(`- ${t} · Note: ${e.text}`);
          }
        });
      lines.push("");
    });
    return lines.join("\n");
  };

  const copyMd = () => {
    const md = buildMarkdown();
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard
          .writeText(md)
          .then(() => ping("Copied"))
          .catch(() => {
            setBackupText(md);
            ping("Markdown in the box");
          });
      } else {
        setBackupText(md);
        ping("Markdown in the box");
      }
    } catch (e) {
      setBackupText(md);
      ping("Markdown in the box");
    }
  };

  const downloadMd = () => {
    const md = buildMarkdown();
    try {
      const blob = new Blob([md], { type: "text/markdown;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      const dt = new Date();
      const p = (n) => String(n).padStart(2, "0");
      a.download = `mind-and-miles-${dt.getFullYear()}-${p(dt.getMonth() + 1)}-${p(dt.getDate())}.md`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      ping("Chronicle exported");
    } catch (e) {
      copyMd();
    }
  };

  // ————— shared UI bits —————
  // engraved double-rule frame
  const card = {
    background: T.panel,
    border: `1px solid ${T.line}`,
    boxShadow: `inset 0 0 0 3px ${T.panel}, inset 0 0 0 4px ${T.lineSoft}`,
    borderRadius: 2,
  };

  const mono = (size = 11, color = T.sub) => ({
    fontFamily: FONT.body,
    fontSize: size,
    color,
    letterSpacing: "0.14em",
    fontWeight: 600,
  });

  const btnInk = { background: T.ink, color: T.panel, border: `1px solid ${T.ink}`, borderRadius: 2, fontFamily: FONT.body, fontSize: 11, fontWeight: 700, letterSpacing: "0.1em" };
  const btnGhost = { background: "transparent", color: T.sub, border: `1px solid ${T.lineSoft}`, borderRadius: 2, fontFamily: FONT.body, fontSize: 11, fontWeight: 700, letterSpacing: "0.1em" };
  const btnWw = { background: T.ww, color: T.panel, border: `1px solid ${T.ink}`, borderRadius: 2, fontFamily: FONT.body, fontSize: 10, fontWeight: 700, letterSpacing: "0.08em" };
  const btnWwOutline = { background: "transparent", color: T.ww, border: `1px solid ${T.ww}`, borderRadius: 2, fontFamily: FONT.body, fontSize: 11, fontWeight: 700, letterSpacing: "0.08em" };
  const btnFmOutline = { background: "transparent", color: T.fm, border: `1px solid ${T.fm}`, borderRadius: 2, fontFamily: FONT.body, fontSize: 11, fontWeight: 700, letterSpacing: "0.08em" };
  const inputS14 = { background: T.paper, border: `1px solid ${T.line}`, borderRadius: 2, color: T.ink, fontFamily: FONT.body, fontSize: 14, outline: "none" };
  const inputS13 = { background: T.paper, border: `1px solid ${T.line}`, borderRadius: 2, color: T.ink, fontFamily: FONT.body, fontSize: 13, outline: "none" };
  const chip = (on, color) => ({
    background: on ? color || T.ink : "transparent",
    color: on ? T.panel : T.sub,
    border: `1px solid ${on ? color || T.ink : T.lineSoft}`,
    borderRadius: 2,
    fontFamily: FONT.body,
    fontSize: 10,
    letterSpacing: "0.08em",
    fontWeight: 700,
  });
  const mindLetterMap = { wuwei: "W", fullmind: "F", nope: "N" };
  const tierGlyph = (t) => {
    const e = effImp(t);
    return e === "urgent" ? (
      <span style={{ fontFamily: FONT.body, fontSize: 12, fontWeight: 700, color: T.np }}>⚑</span>
    ) : e === "important" ? (
      <Blaze color={T.fm} size={10} />
    ) : (
      <span style={{ fontFamily: FONT.body, fontSize: 13, color: T.line }}>·</span>
    );
  };


  // rubricated section header
  const Rubric = ({ children, className = "" }) => (
    <p className={className} style={{ ...mono(11, T.rubric) }}>
      ¶ {children}
    </p>
  );

  const Rule = ({ className = "" }) => (
    <div
      className={className}
      style={{ borderTop: `1px solid ${T.line}`, borderBottom: `1px solid ${T.line}`, height: 4 }}
    />
  );

  const NavBtn = ({ id, label }) => {
    const active =
      view.name === id ||
      (id === "now" && (view.name === "state" || view.name === "stack")) ||
      (id === "more" && ["more", "train", "log", "settings"].includes(view.name));
    return (
      <button
        onClick={() => setView({ name: id })}
        className="flex-1 py-4 uppercase transition"
        style={{
          ...mono(11, active ? T.ink : T.sub),
          borderTop: active ? `2px solid ${T.ink}` : "2px solid transparent",
          background: "transparent",
        }}
      >
        {label}
      </button>
    );
  };

  const BackLink = ({ label = "← check in again", to = { name: "now" } }) => (
    <button
      onClick={() => setView(to)}
      className="mb-4"
      style={{ ...mono(11), background: "transparent" }}
    >
      {label}
    </button>
  );

  if (!loaded) {
    return (
      <div
        className="min-h-screen flex items-center justify-center"
        style={{ background: T.paper }}
      >
        <Blaze color={T.ww} size={22} />
      </div>
    );
  }

  // exercise-first callout, shown in FULL MIND and NOPE when nothing is logged today
  const MoveFirst = () => {
    if (todayWorkouts.length > 0) return null;
    let msg;
    if (daysSinceOtf !== null && daysSinceOtf >= 4) {
      msg = `${daysSinceOtf} days since OTF — long gaps make the next one harder. Go today if you're able.`;
    } else if (weekOtf < (Number(S.otfTarget) || 3)) {
      msg = `Body willing? Movement is the fastest exit — an OTF session (${weekOtf}/${S.otfTarget} this week) or easy miles.`;
    } else {
      msg = "Body willing? Easy miles reset everything.";
    }
    return (
      <div className="px-4 py-3 mb-4" style={{ ...card, borderLeft: `4px solid ${T.ww}` }}>
        <p style={{ ...mono(10, T.ww) }}>IF YOU CAN MOVE, MOVE</p>
        <p className="mt-1" style={{ fontFamily: FONT.body, fontSize: 14, color: T.ink, lineHeight: 1.5 }}>
          {msg}
        </p>
        <button
          onClick={() => setView({ name: "train" })}
          className="mt-2"
          style={{ ...mono(11, T.ww), background: "transparent" }}
        >
          TO TRAINING →
        </button>
      </div>
    );
  };

  // ————— views —————
  const NowView = () => (
    <div>
      {currentState ? (
        <div
          className="px-4 py-3 mb-4 flex items-center gap-3"
          style={{ ...card, borderLeft: `4px solid ${STATES[currentState.key].color}` }}
        >

                        <span className="flex-1" style={{ fontFamily: FONT.body, fontSize: 12.5, color: T.ink }}>

                <div className="flex gap-2 mt-2">
                  <input

                    onKeyDown={(e) => {

                    placeholder="Add to the agenda…"
                    className="flex-1 px-2 py-1"
                    style={inputS13}

                  <button onClick={() => addAgenda(m.id)} className="px-3 shrink-0" style={{ ...mono(10, T.ink), background: T.panel, border: `1px solid ${T.line}`, borderRadius: 2 }}>

                </div>
                <div className="flex gap-2 mt-2 items-center">
                  <button onClick={() => metToday(m.id)} className="flex-1 py-2" style={btnWwOutline}>

                    <button onClick={() => snoozeMeeting(m.id)} className="px-3 py-2 shrink-0" style={btnGhost}>

                  {schedOpen ? (
                    <>
                      <input type="date" value={schedDate} onChange={(e) => setSchedDate(e.target.value)} className="flex-1 px-2 py-1" style={inputS13} />
                      <button onClick={() => scheduleMeeting(m.id)} className="px-3 py-2 shrink-0" style={btnInk}>

                      </button>

                    <button
                      onClick={() => {

                        setSchedDate("");

                      className="flex-1 py-2"
                      style={btnFmOutline}
                    >
                      SCHEDULED…
                    </button>
                  )}
                </div>
              </div>
            );
          })}
        </div>
        <div className="flex gap-2 mt-3">
          <input value={mtName} onChange={(e) => setMtName(e.target.value)} placeholder="Name…" className="flex-1 px-3 py-2" style={inputS14} />
          <input value={mtCadence} onChange={(e) => setMtCadence(e.target.value)} inputMode="numeric" placeholder="days" className="px-2 py-2" style={{ ...inputS14, width: 64, textAlign: "right" }} />
          <button onClick={addMeeting} className="px-4 shrink-0" style={{ ...mono(11, T.ink), background: T.panel, border: `1px solid ${T.line}`, borderRadius: 2 }}>
            ADD
          </button>
        </div>
        <p className="mt-2" style={{ fontFamily: FONT.body, fontStyle: "italic", fontSize: 11, color: T.sub, lineHeight: 1.5 }}>
          Cadence is in days — "every 14" raises them two weeks after you last met. MET resets the
          clock and inscribes it in the Chronicle; SCHEDULED quiets the task until the date passes.
        </p>
      </div>
    );
  };

  const TasksView = () => {
    const activeKey = taskView || taskKeyNow;
    const list = data.tasks[activeKey] || [];
    const open = list.filter((t) => t.state === "open");
    const deck = deckFor(activeKey, mindNow);
    const front = deck[0] || null;
    const hasFinished = list.some((t) => t.state !== "open");
    const pinnedIds = (data.top3 && data.top3[activeKey]) || [];
    const unsortedList = open.filter((t) => t.unsorted);
    const importants = open.filter((t) => effImp(t) === "important");
    const overCap = importants.length - (Number(S.impCap) || 30);
    if (meetView) return MeetingsView();
    const startTaskEdit = (t) => {
      setEditTaskId(t.id);
      setEditTaskText(t.text);
      setEditTaskImp(t.imp || "normal");
      setEditTaskMind(t.mind || "fullmind");
      setEditTaskDate(t.urgentAt ? toLocalInput(t.urgentAt).slice(0, 10) : "");
      setEditFrom("deck");
    };
    const TaskEditor = () => (
      <div className="mt-2 flex flex-col gap-2">
        <input
          value={editTaskText}
          onChange={(e) => setEditTaskText(e.target.value)}
          onKeyDown={(e) => {
            if (e.key === "Enter") saveTaskEdit(activeKey);
          }}
          autoFocus
          className="w-full px-2 py-1"
          style={{ ...inputS13, fontSize: 13.5 }}
        />
        <div className="flex gap-2">
          {["urgent", "important", "normal"].map((v) => (
            <button
              key={v}
              onClick={() => setEditTaskImp(v)}
              className="px-2 py-1"
              style={chip(editTaskImp === v, v === "urgent" ? T.np : v === "important" ? T.fm : null)}
            >
              {v.toUpperCase()}
            </button>
          ))}
        </div>
        <div className="flex gap-2">
          {Object.values(STATES).map((st) => (
            <button
              key={st.key}
              onClick={() => setEditTaskMind(st.key)}
              className="px-2 py-1"
              style={chip(editTaskMind === st.key, st.color)}

              {st.name.toUpperCase()}
            </button>

        </div>
        {editTaskImp === "important" && (
          <div className="flex items-center gap-2">
            <label style={{ ...mono(9) }}>URGENT ON</label>
            <input
              type="date"
              value={editTaskDate}
              onChange={(e) => setEditTaskDate(e.target.value)}
              className="flex-1 px-2 py-1"
              style={inputS13}

          </div>
        )}
        <div className="flex gap-2">
          <button onClick={() => saveTaskEdit(activeKey)} className="flex-1 py-2" style={btnInk}>
            SAVE

          <button onClick={() => setEditTaskId(null)} className="flex-1 py-2" style={btnGhost}>
            CANCEL
          </button>
        </div>
      </div>
    );
    return (
      <div>
        <div className="flex items-center justify-between mb-2">
          <Rubric>THE TASK LIST</Rubric>
          <button onClick={() => setMeetView(true)} style={{ ...mono(10, T.ww), background: "transparent" }}>
            MEETINGS{meetingsDue().length ? ` (${meetingsDue().length})` : ""} →
          </button>
        </div>
        <div className="flex gap-2 mb-3">
          {["work", "home"].map((k) => {
            const on = activeKey === k;
            const nOpen = (data.tasks[k] || []).filter((t) => t.state === "open").length;
            const nUrg = (data.tasks[k] || []).filter(
              (t) => t.state === "open" && effImp(t) === "urgent"
            ).length;
            return (
              <button key={k} onClick={() => setTaskView(k)} className="px-3 py-1 transition" style={chip(on)}>
                {k === "work" ? "AT WORK" : "AT HOME"} ({nOpen}){nUrg > 0 ? " ⚑" + nUrg : ""}
                {k === taskKeyNow ? " ◂" : ""}
              </button>
            );
          })}
        </div>

        {cullOpen ? (
          <div className="px-4 py-4 mb-3" style={{ ...card, borderLeft: `4px solid ${T.np}` }}>
            <p style={{ ...mono(10, T.np) }}>CULL THE HERD</p>
            <p className="mt-1 mb-2" style={{ fontFamily: FONT.body, fontSize: 13, color: T.ink, lineHeight: 1.5 }}>
              {overCap > 0
                ? `${importants.length} important tasks — demote or delete at least ${overCap} to get under ${S.impCap}.`
                : "Under the cap — the herd is culled."}
            </p>
            <div className="flex flex-col gap-1">
              {importants.map((t) => (
                <div key={t.id} className="flex items-center gap-2 px-3 py-2" style={card}>
                  <span className="flex-1" style={{ fontFamily: FONT.body, fontSize: 13, color: T.ink }}>
                    {t.text}
                  </span>
                  <button onClick={() => demoteTask(activeKey, t.id)} className="px-2 py-1 shrink-0" style={chip(false)}>
                    NORMAL
                  </button>
                  <button onClick={() => deleteTask(activeKey, t.id)} className="shrink-0" style={{ ...mono(11, T.np), background: "transparent" }}>
                    ✕
                  </button>
                </div>
              ))}
            </div>
            <button onClick={() => setCullOpen(false)} className="w-full py-2 mt-2" style={btnGhost}>
              CLOSE

          </div>
        ) : sortOpen && unsortedList.length > 0 ? (
          (() => {
            const u = unsortedList[0];
            return (
              <div className="px-4 py-4 mb-3" style={{ ...card, borderLeft: `4px solid ${T.ww}` }}>

                <p className="mt-1" style={{ fontFamily: FONT.body, fontSize: 15, fontWeight: 600, color: T.ink, lineHeight: 1.4 }}>
                  {u.text}

                <div className="flex gap-2 mt-2">
                  {["urgent", "important", "normal"].map((v) => (
                    <button key={v} onClick={() => setQaImp(v)} className="px-2 py-1" style={chip(qaImp === v, v === "urgent" ? T.np : v === "important" ? T.fm : null)}>
                      {v.toUpperCase()}
                    </button>

                </div>
                <div className="flex gap-2 mt-2">
                  {Object.values(STATES).map((s) => (

                      {s.name.toUpperCase()}

                </div>
                <div className="flex gap-2 mt-3">
                  <button onClick={() => sortApply(activeKey, u.id, qaImp, qaMind)} className="flex-1 py-2" style={btnInk}>

                  <button onClick={() => setSortOpen(false)} className="flex-1 py-2" style={btnGhost}>

        ) : front ? (
          <div className="px-4 py-4 mb-3" style={{ ...card, borderLeft: `4px solid ${T.ww}` }}>
            <p style={{ ...mono(10, T.ww) }}>ON DECK · WORK THE FRONT</p>
            <div className="flex items-start gap-2 mt-1">
              <span className="shrink-0 mt-1">{tierGlyph(front)}</span>
              <p className="flex-1" style={{ fontFamily: FONT.body, fontSize: 16, fontWeight: 600, color: T.ink, lineHeight: 1.4 }}>

              {!front.virtual && (
                <button onClick={() => startTaskEdit(front)} className="shrink-0" style={{ ...mono(11, T.rubric), background: "transparent" }}>

                </button>

            {front.virtual ? (
              <div>

                {front.virtual === "meet" && (
                  <button
                    onClick={() => snoozeMeeting(front.id.slice(5))}

                    style={btnFmOutline}
                  >
                    ↻ IN PROGRESS — BACK TOMORROW
                  </button>
                )}
              </div>
            ) : editTaskId === front.id && editFrom === "deck" ? (
              TaskEditor()
            ) : (
              <div className="flex gap-2 mt-3 items-center">
                <button onClick={() => resolveTask(activeKey, front.id, "later")} className="flex-1 py-2" style={btnFmOutline}>
                  ↻ LATER
                </button>
                <button onClick={() => keepOnDeck(activeKey, front.id, mindNow)} className="flex-1 py-2" style={btnWwOutline}>
                  KEEP ON DECK
                </button>
                <button onClick={() => resolveTask(activeKey, front.id, "done")} className="px-3 py-2 shrink-0" style={btnWw}>
                  DONE ✓
                </button>
              </div>
            )}
            {deck.slice(1).map((t) => (
              <div key={t.id} className="mt-2" style={{ opacity: 0.85 }}>
                <div className="flex items-center gap-2">
                  <span className="shrink-0">{tierGlyph(t)}</span>
                  <span className="flex-1" style={{ fontFamily: FONT.body, fontSize: 12.5, color: T.ink }}>
                    {t.text}
                  </span>
                  {t.virtual ? (
                    <button onClick={() => openVirtual(t)} className="shrink-0" style={{ ...mono(9, T.np), background: "transparent" }}>
                      OPEN ▸
                    </button>
                  ) : (
                    <>
                      <button
                        onClick={() => frontTask(activeKey, t.id, mindNow)}
                        className="shrink-0 px-2 py-1"
                        style={{ ...mono(9, T.panel), background: T.ww, border: `1px solid ${T.ink}`, borderRadius: 2 }}
                      >
                        WORK THIS ↑
                      </button>
                      <button onClick={() => startTaskEdit(t)} className="shrink-0" style={{ ...mono(10, T.rubric), background: "transparent" }}>
                        ✎
                      </button>
                      {pinnedIds.includes(t.id) && (
                        <button onClick={() => pinToggle(activeKey, t.id)} className="shrink-0" style={{ ...mono(9), background: "transparent" }}>
                          ✕
                        </button>
                      )}
                    </>
                  )}
                </div>
                {editTaskId === t.id && editFrom === "deck" && TaskEditor()}
              </div>
            ))}
          </div>
        ) : (
          <p className="mb-3" style={{ fontFamily: FONT.body, fontStyle: "italic", fontSize: 13, color: T.sub }}>
            Nothing on deck for {STATES[mindNow] ? STATES[mindNow].name : "this state"} — add a task
            with the + button.
          </p>
        )}

        <div className="flex flex-col gap-1">
          {list.length === 0 && (
            <p style={{ fontFamily: FONT.body, fontStyle: "italic", fontSize: 13.5, color: T.sub }}>

            </p>
          )}
          {list.map((t) => {
            const isFront = front && front.id === t.id;
            const isPinned = pinnedIds.includes(t.id);
            const isEd = editTaskId === t.id && editFrom === "list";
            return (
              <div
                key={t.id}
                onClick={
                  isEd
                    ? undefined
                    : t.state === "open"
                    ? () => pinToggle(activeKey, t.id)
                    : t.state === "done"
                    ? () => reopenTask(activeKey, t.id)
                    : undefined
                }
                className="px-3 py-2"
                style={{
                  ...card,
                  opacity: t.state === "open" ? 1 : 0.55,
                  borderLeft: isFront
                    ? `4px solid ${T.ww}`
                    : isPinned
                    ? `4px solid ${T.lineSoft}`
                    : `1px solid ${T.line}`,
                  cursor: isEd || t.state === "reentered" ? "default" : "pointer",
                }}
              >
                <div className="flex items-center gap-2">
                  <span className="shrink-0" style={{ width: 16, textAlign: "center" }}>
                    {t.state === "done" ? (
                      <span style={{ color: T.ww, fontWeight: 700, fontFamily: FONT.body, fontSize: 13 }}>✓</span>
                    ) : t.state === "reentered" ? (
                      <span style={{ color: T.sub, fontFamily: FONT.body, fontSize: 12 }}>↻</span>
                    ) : (
                      tierGlyph(t)
                    )}
                  </span>
                  {isEd ? (
                    <input
                      value={editTaskText}
                      onChange={(e) => setEditTaskText(e.target.value)}
                      onKeyDown={(e) => {
                        if (e.key === "Enter") saveTaskEdit(activeKey);
                      }}
                      autoFocus
                      className="flex-1 px-2 py-1"
                      style={{ ...inputS13, fontSize: 13.5 }}
                    />
                  ) : (
                    <span
                      className="flex-1"
                      style={{
                        fontFamily: FONT.body,
                        fontSize: 13.5,
                        color: T.ink,
                        fontWeight: isFront ? 700 : 400,
                        textDecoration: t.state === "reentered" ? "line-through" : "none",
                      }}
                    >
                      {t.text}
                      {t.state === "open" && (
                        <span style={{ color: T.sub, fontSize: 10.5 }}>
                          {" "}· {mindLetterMap[t.mind] || "F"}
                          {isPinned ? " · deck" : ""}
                          {t.urgentAt && effImp(t) !== "urgent"
                            ? ` · ⚑${new Date(t.urgentAt).getMonth() + 1}/${new Date(t.urgentAt).getDate()}`
                            : ""}
                        </span>
                      )}
                    </span>
                  )}
                  {isEd ? (
                    <>
                      <button
                        onClick={(e) => {
                          e.stopPropagation();
                          saveTaskEdit(activeKey);
                        }}
                        className="shrink-0"
                        style={{ ...mono(9, T.ww), background: "transparent" }}
                      >
                        SAVE
                      </button>
                      <button
                        onClick={(e) => {
                          e.stopPropagation();
                          setEditTaskId(null);
                        }}
                        className="shrink-0"
                        style={{ ...mono(9), background: "transparent" }}
                      >
                        CANCEL
                      </button>
                    </>
                  ) : (
                    <>
                      <button
                        onClick={(e) => {
                          e.stopPropagation();
                          setEditTaskId(t.id);
                          setEditTaskText(t.text);
                          setEditTaskImp(t.imp || "normal");
                          setEditTaskMind(t.mind || "fullmind");
                          setEditTaskDate(t.urgentAt ? toLocalInput(t.urgentAt).slice(0, 10) : "");
                          setEditFrom("list");
                        }}
                        className="shrink-0"
                        style={{ ...mono(11, T.rubric), background: "transparent" }}
                      >
                        ✎
                      </button>
                      <button
                        onClick={(e) => {
                          e.stopPropagation();
                          deleteTask(activeKey, t.id);
                        }}
                        className="shrink-0"
                        style={{ ...mono(11), background: "transparent" }}
                      >
                        ✕
                      </button>
                    </>
                  )}
                </div>
                {isEd && (
                  <div className="mt-2 flex flex-col gap-2">
                    <div className="flex gap-2">
                      {["urgent", "important", "normal"].map((v) => (
                        <button
                          key={v}
                          onClick={(e) => {
                            e.stopPropagation();
                            setEditTaskImp(v);
                          }}
                          className="px-2 py-1"
                          style={chip(editTaskImp === v, v === "urgent" ? T.np : v === "important" ? T.fm : null)}
                        >
                          {v.toUpperCase()}
                        </button>
                      ))}
                    </div>
                    <div className="flex gap-2">
                      {Object.values(STATES).map((s) => (
                        <button
                          key={s.key}
                          onClick={(e) => {
                            e.stopPropagation();
                            setEditTaskMind(s.key);
                          }}
                          className="px-2 py-1"
                          style={chip(editTaskMind === s.key, s.color)}
                        >
                          {s.name.toUpperCase()}
                        </button>
                      ))}
                    </div>
                    {editTaskImp === "important" && (
                      <div className="flex items-center gap-2">
                        <label style={{ ...mono(9) }}>URGENT ON</label>
                        <input
                          type="date"
                          value={editTaskDate}
                          onChange={(e) => setEditTaskDate(e.target.value)}
                          onClick={(e) => e.stopPropagation()}
                          className="flex-1 px-2 py-1"
                          style={inputS13}
                        />
                      </div>
                    )}
                  </div>
                )}
              </div>
            );
          })}
        </div>
        {hasFinished && (
          <div className="flex gap-3 mt-2">
            <button onClick={() => sweepFinished(activeKey)} style={{ ...mono(9), background: "transparent" }}>
              SWEEP FINISHED
            </button>
          </div>
        )}
        {!bulkOpen ? (
          <button onClick={() => setBulkOpen(true)} className="mt-2" style={{ ...mono(9), background: "transparent" }}>
            ADD MANY AT ONCE ▸
          </button>
        ) : (
          <div className="mt-2">
            <textarea
              value={bulkText}
              onChange={(e) => setBulkText(e.target.value)}
              rows={5}
              placeholder={"One task per line (or ; between) — added as Normal, tagged with your current state."}
              className="w-full p-2"
              style={{ ...inputS13, fontSize: 13.5, resize: "vertical" }}
            />
            <div className="flex gap-2 mt-2">
              <button onClick={() => addBulk(activeKey)} className="flex-1 py-2" style={btnInk}>
                ADD ALL
              </button>
              <button
                onClick={() => {
                  setBulkOpen(false);
                  setBulkText("");
                }}
                className="flex-1 py-2"
                style={btnGhost}
              >
                CANCEL
              </button>
            </div>
          </div>

        <p className="mt-3" style={{ fontFamily: FONT.body, fontStyle: "italic", fontSize: 11, color: T.sub, lineHeight: 1.5 }}>

        </p>

  };

  const TrainView = () => (
    <div>
      {/* goal */}
      <div className="px-4 py-4 mb-4" style={card}>
        <div className="flex items-end justify-between">
          <div>
            <Rubric>THE QUEST</Rubric>
            <p style={{ fontFamily: FONT.disp, fontSize: 34, color: T.ink, lineHeight: 1.1 }}>
              100 Miles
            </p>
            <p style={{ fontFamily: FONT.body, fontStyle: "italic", fontSize: 13, color: T.sub, marginTop: 2 }}>
              in 24 hours
            </p>
          </div>
          <div className="text-right">
            <p style={{ ...mono(10) }}>LONGEST RUN</p>
            <p style={{ fontFamily: FONT.disp, fontSize: 28, color: T.ww }}>
              {longest.toFixed(1)} <span style={{ fontSize: 17 }}>mi</span>
            </p>
          </div>
        </div>
        <div
          className="mt-3 w-full"
          style={{ height: 10, background: T.paper, border: `1px solid ${T.line}`, borderRadius: 1 }}
        >
          <div
            style={{
              width: `${Math.min(100, (longest / 100) * 100)}%`,
              height: "100%",
              background: T.ww,
              transition: "width .4s ease",
            }}
          />
        </div>
        <p className="mt-1" style={{ ...mono(9) }}>
          LONGEST RUN VS 100 MI

                  type="date"
                  value={qaDate}
                  onChange={(e) => setQaDate(e.target.value)}
                  className="flex-1 px-2 py-1"
                  style={inputS13}
                />
              </div>
            )}
            <div className="flex gap-2 mt-3">
              <button onClick={addQuick} className="flex-1 py-2" style={btnInk}>
                ADD
              </button>
              <button onClick={() => setQaOpen(false)} className="flex-1 py-2" style={btnGhost}>
                CANCEL
              </button>
            </div>
          </div>
        </div>
      )}

      {/* the + */}
      {!medOpen && !qaOpen && (
        <button
          onClick={() => {
            setQaList(taskKeyNow);
            setQaMind(mindNow);
            setQaImp("normal");
            setQaOpen(true);
          }}
          className="fixed"
          style={{
            right: 18,
            bottom: 86,
            width: 54,
            height: 54,
            background: T.ink,
            color: T.panel,
            borderRadius: 4,
            fontFamily: FONT.disp,
            fontSize: 30,
            zIndex: 22,
            boxShadow: `0 0 0 3px ${T.paper}, 0 0 0 4px ${T.lineSoft}`,
            lineHeight: "54px",
            textAlign: "center",
            padding: 0,
          }}
        >
          +
        </button>
      )}

      {/* toast */}
      {toast && (
        <div
          className="fixed left-0 right-0 flex justify-center"
          style={{ bottom: 76, zIndex: 30, pointerEvents: "none" }}
        >
          <span
            className="px-4 py-2"
            style={{
              background: T.ink,
              color: T.panel,
              borderRadius: 2,
              fontFamily: FONT.body,
              fontSize: 11,
              letterSpacing: "0.14em",
              fontWeight: 700,
            }}
          >
            {toast.toUpperCase()} ✓
          </span>
        </div>
      )}

      {/* bottom nav */}
      <div
        className="fixed bottom-0 left-0 right-0"
        style={{ background: T.panel, borderTop: `1px solid ${T.line}`, boxShadow: `0 -3px 0 ${T.paper}, 0 -4px 0 ${T.lineSoft}`, zIndex: 20 }}
      >
        <div className="max-w-md mx-auto flex">
          <NavBtn id="now" label="Now" />
          <NavBtn id="tasks" label="Tasks" />
          <NavBtn id="more" label="⋯" />
        </div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));

</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
